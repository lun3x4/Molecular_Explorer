
<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mol.ex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<!-- SmilesDrawer for skeletal formula rendering -->

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
--bg: #f7f6f2;
--ink: #111;
--soft: #aaa9a4;
--line: #e0dfd9;
--accent: #c84b2f;
--canvas-bg: #f7f6f2;
}

html { scroll-behavior: smooth; }

body {
background: var(--bg);
color: var(--ink);
font-family: 'DM Mono', monospace;
font-size: 13px;
min-height: 100vh;
overflow-x: hidden;
}

/* ── HEADER ─────────────────────────────────────── */
header {
display: flex;
align-items: baseline;
gap: 6px;
padding: 32px 40px 0;
user-select: none;
}

.logo {
font-family: 'Instrument Serif', serif;
font-style: italic;
font-size: 22px;
letter-spacing: -0.5px;
color: var(--ink);
}

.logo-dot { color: var(--accent); }
.logo-sub {
font-family: 'DM Mono', monospace;
font-size: 10px;
color: var(--soft);
letter-spacing: 0.08em;
font-weight: 300;
}

/* ── SEARCH ──────────────────────────────────────── */
.search-section {
display: flex;
flex-direction: column;
align-items: center;
padding: 80px 24px 0;
transition: padding 0.5s ease;
}

.search-section.has-result {
padding-top: 32px;
}

.search-wrap {
width: 100%;
max-width: 560px;
position: relative;
}

.search-input {
width: 100%;
background: transparent;
border: none;
border-bottom: 1.5px solid var(--ink);
padding: 10px 36px 10px 0;
font-family: 'DM Mono', monospace;
font-size: 20px;
font-weight: 300;
color: var(--ink);
outline: none;
caret-color: var(--accent);
letter-spacing: -0.3px;
transition: border-color 0.2s;
}

.search-input::placeholder { color: var(--soft); }
.search-input:focus { border-color: var(--accent); }

.search-icon {
position: absolute;
right: 0;
top: 50%;
transform: translateY(-50%);
color: var(--soft);
font-size: 16px;
pointer-events: none;
}

/* ── AUTOCOMPLETE ────────────────────────────────── */
.suggestions {
position: absolute;
top: calc(100% + 8px);
left: 0;
right: 0;
background: #fff;
border: 1px solid var(--line);
border-radius: 2px;
z-index: 100;
overflow: hidden;
box-shadow: 0 8px 32px rgba(0,0,0,0.06);
display: none;
}

.suggestions.visible { display: block; }

.suggestion-item {
display: flex;
align-items: baseline;
gap: 10px;
padding: 10px 14px;
cursor: pointer;
border-bottom: 1px solid var(--line);
transition: background 0.1s;
}

.suggestion-item:last-child { border-bottom: none; }
.suggestion-item:hover { background: var(--bg); }

.sug-name {
font-size: 13px;
font-weight: 400;
color: var(--ink);
}

.sug-formula {
font-size: 11px;
color: var(--soft);
font-style: italic;
}

/* ── LOADING ─────────────────────────────────────── */
.loader {
display: none;
margin: 60px auto 0;
width: 28px;
height: 28px;
border: 1.5px solid var(--line);
border-top-color: var(--ink);
border-radius: 50%;
animation: spin 0.7s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ── MOLECULE CARD ────────────────────────────────── */
.mol-card {
display: none;
max-width: 680px;
margin: 48px auto 80px;
padding: 0 24px;
animation: fadeUp 0.4s ease forwards;
}

@keyframes fadeUp {
from { opacity: 0; transform: translateY(16px); }
to { opacity: 1; transform: translateY(0); }
}

/* Canvas container */
.mol-canvas-wrap {
width: 100%;
aspect-ratio: 4/3;
max-height: 420px;
display: flex;
align-items: center;
justify-content: center;
background: var(--bg);
border: 1px solid var(--line);
border-radius: 2px;
overflow: hidden;
}
#svgContainer {
width: 100%;
height: 100%;
display: flex;
align-items: center;
justify-content: center;
}
#svgContainer svg {
width: 100% !important;
height: 100% !important;
max-width: 100%;
max-height: 100%;
}

.no-structure {
color: var(--soft);
font-size: 11px;
letter-spacing: 0.1em;
text-transform: uppercase;
}

/* Name + formula strip */
.mol-header {
display: flex;
justify-content: space-between;
align-items: flex-start;
margin-top: 28px;
gap: 16px;
}

.mol-name {
font-family: 'Instrument Serif', serif;
font-style: italic;
font-size: 30px;
line-height: 1.1;
letter-spacing: -0.5px;
flex: 1;
}

.mol-formula {
font-family: 'DM Mono', monospace;
font-size: 13px;
color: var(--soft);
white-space: nowrap;
padding-top: 6px;
font-weight: 300;
}

/* IUPAC */
.mol-iupac {
margin-top: 6px;
font-size: 11px;
color: var(--soft);
font-style: italic;
line-height: 1.5;
}

/* Divider */
.divider {
width: 100%;
height: 1px;
background: var(--line);
margin: 28px 0;
}

/* Properties grid */
.props-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
gap: 1px;
background: var(--line);
border: 1px solid var(--line);
border-radius: 2px;
overflow: hidden;
}

.prop-cell {
background: var(--bg);
padding: 16px 18px;
display: flex;
flex-direction: column;
gap: 4px;
}

.prop-label {
font-size: 9px;
text-transform: uppercase;
letter-spacing: 0.14em;
color: var(--soft);
font-weight: 500;
}

.prop-value {
font-size: 15px;
font-weight: 400;
color: var(--ink);
letter-spacing: -0.2px;
}

.prop-value.accent { color: var(--accent); }

.prop-unit {
font-size: 10px;
color: var(--soft);
font-weight: 300;
}

/* CID badge */
.mol-footer {
margin-top: 20px;
display: flex;
justify-content: space-between;
align-items: center;
}

.cid-link {
font-size: 10px;
color: var(--soft);
text-decoration: none;
letter-spacing: 0.06em;
transition: color 0.15s;
}

.cid-link:hover { color: var(--ink); }

.smiles-text {
font-size: 9px;
color: var(--soft);
font-style: italic;
max-width: 360px;
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
}

/* ── EMPTY STATE ──────────────────────────────────── */
.empty-state {
text-align: center;
padding: 60px 0;
color: var(--soft);
font-size: 11px;
letter-spacing: 0.1em;
text-transform: uppercase;
}

.empty-examples {
margin-top: 20px;
display: flex;
flex-wrap: wrap;
gap: 8px;
justify-content: center;
}

.example-pill {
font-size: 11px;
letter-spacing: 0.04em;
padding: 5px 12px;
border: 1px solid var(--line);
border-radius: 100px;
cursor: pointer;
color: var(--ink);
transition: all 0.15s;
font-style: italic;
font-family: 'Instrument Serif', serif;
}

.example-pill:hover {
background: var(--ink);
color: var(--bg);
border-color: var(--ink);
}

/* ── ERROR ───────────────────────────────────────── */
.error-msg {
display: none;
text-align: center;
padding: 40px;
color: var(--accent);
font-size: 11px;
letter-spacing: 0.08em;
text-transform: uppercase;
}
</style>

</head>
<body>

<header>
<span class="logo">mol<span class="logo-dot">.</span>ex</span>
<span class="logo-sub">molecular explorer</span>
</header>

<section class="search-section" id="searchSection">
<div class="search-wrap">
<input
type="text"
class="search-input"
id="searchInput"
placeholder="aspirine, ethanol, C6H12O6…"
autocomplete="off"
spellcheck="false"
/>
<span class="search-icon">↵</span>
<div class="suggestions" id="suggestions"></div>
</div>

<div class="loader" id="loader"></div>
<div class="error-msg" id="errorMsg">Molécule introuvable</div>

<!-- Empty state -->

<div class="empty-state" id="emptyState">
<div>chercher une molécule</div>
<div class="empty-examples">
<span class="example-pill" onclick="quickSearch('aspirin', 'aspirine')">aspirine</span>
<span class="example-pill" onclick="quickSearch('caffeine', 'caféine')">caféine</span>
<span class="example-pill" onclick="quickSearch('glucose', 'glucose')">glucose</span>
<span class="example-pill" onclick="quickSearch('dopamine', 'dopamine')">dopamine</span>
<span class="example-pill" onclick="quickSearch('benzene', 'benzène')">benzène</span>
<span class="example-pill" onclick="quickSearch('cholesterol', 'cholestérol')">cholestérol</span>
<span class="example-pill" onclick="quickSearch('ethanol', 'éthanol')">éthanol</span>
<span class="example-pill" onclick="quickSearch('acetone', 'acétone')">acétone</span>
</div>
</div>
</section>

<!-- Molecule result -->

<div class="mol-card" id="molCard">
<div class="mol-canvas-wrap" id="canvasWrap">
<img id="molImg" src="" alt="" style="display:none; max-width:100%; max-height:100%; object-fit:contain;" />
<div class="no-structure" id="noStructure" style="display:none">structure non disponible</div>
</div>

<div class="mol-header">
<div class="mol-name" id="molName">—</div>
<div class="mol-formula" id="molFormula">—</div>
</div>
<div class="mol-iupac" id="molIupac"></div>

<div class="divider"></div>

<div class="props-grid" id="propsGrid"></div>

<div class="mol-footer">
<span class="smiles-text" id="smilesText"></span>
<a class="cid-link" id="pubchemLink" href="#" target="_blank">→ PubChem</a>
</div>
</div>

<script>
// ────────────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────────────
let suggestTimeout = null;
let currentCID = null;

// ────────────────────────────────────────────────────
// PUBCHEM API HELPERS
// ────────────────────────────────────────────────────
const PUB = 'https://pubchem.ncbi.nlm.nih.gov/rest/pug';

async function searchCID(query) {
// Try name first
const q = encodeURIComponent(query.trim());
const url = `${PUB}/compound/name/${q}/cids/JSON`;
const r = await fetch(url);
if (r.ok) {
const d = await r.json();
return d.IdentifierList?.CID?.[0] ?? null;
}
// Try formula
const url2 = `${PUB}/compound/formula/${q}/cids/JSON`;
const r2 = await fetch(url2);
if (r2.ok) {
const d2 = await r2.json();
return d2.IdentifierList?.CID?.[0] ?? null;
}
return null;
}

async function fetchProperties(cid) {
// Une seule requête groupée — PubChem gère bien les propriétés connues en batch.
// XLogP est exclu ici car absent pour certains composés (sels, ions) et ferait
// planter toute la requête sur ces cas. Il est récupéré séparément après.
const props = [
'MolecularFormula', 'MolecularWeight', 'CanonicalSMILES', 'IsomericSMILES',
'IUPACName', 'ExactMass', 'TPSA', 'HBondDonorCount',
'HBondAcceptorCount', 'RotatableBondCount', 'HeavyAtomCount'
].join(',');

try {
const r = await fetch(`${PUB}/compound/cid/${cid}/property/${props}/JSON`);
if (!r.ok) return null;
const d = await r.json();
const base = d.PropertyTable?.Properties?.[0] ?? null;
if (!base) return null;

// XLogP — optionnel, absent pour les sels/ions
try {
const r2 = await fetch(`${PUB}/compound/cid/${cid}/property/XLogP/JSON`);
if (r2.ok) {
const d2 = await r2.json();
const xlogp = d2.PropertyTable?.Properties?.[0]?.XLogP;
if (xlogp != null) base.XLogP = xlogp;
}
} catch {}

return base;
} catch (e) {
console.error('fetchProperties error:', e);
return null;
}
}

async function fetchSynonyms(cid) {
const url = `${PUB}/compound/cid/${cid}/synonyms/JSON`;
const r = await fetch(url);
if (!r.ok) return [];
const d = await r.json();
return d.InformationList?.Information?.[0]?.Synonym ?? [];
}

async function fetchPhysicalData(cid) {
// PUG View — seul endpoint qui expose les données expérimentales
const url = `https://pubchem.ncbi.nlm.nih.gov/rest/pug_view/data/compound/${cid}/JSON`;
try {
const r = await fetch(url);
if (!r.ok) return {};
const d = await r.json();
return extractPhysicalProps(d);
} catch { return {}; }
}

function extractPhysicalProps(data) {
const result = {};
const sections = data?.Record?.Section ?? [];

function walkSections(secs) {
for (const sec of secs) {
const heading = sec.TOCHeading ?? '';

// Boiling point
if (/boiling point/i.test(heading)) {
const val = firstStringValue(sec);
if (val) result.boilingPoint = val;
}
// Melting point
if (/melting point/i.test(heading)) {
const val = firstStringValue(sec);
if (val) result.meltingPoint = val;
}
// Flash point
if (/flash point/i.test(heading)) {
const val = firstStringValue(sec);
if (val) result.flashPoint = val;
}
// Density
if (/^density$/i.test(heading)) {
const val = firstStringValue(sec);
if (val) result.density = val;
}
// Solubility
if (/solubility/i.test(heading) && !result.solubility) {
const val = firstStringValue(sec);
if (val) result.solubility = val;
}

if (sec.Section) walkSections(sec.Section);
}
}

walkSections(sections);
return result;
}

function firstStringValue(sec) {
const info = sec?.Information ?? [];
for (const item of info) {
const vals = item?.Value?.StringWithMarkup ?? [];
if (vals.length > 0) return vals[0]?.String ?? null;
}
return null;
}

// ────────────────────────────────────────────────────
// AUTOCOMPLETE
// ────────────────────────────────────────────────────
async function fetchSuggestions(query) {
const q = encodeURIComponent(query.trim());
const url = `https://pubchem.ncbi.nlm.nih.gov/rest/autocomplete/compound/${q}/json?limit=6`;
try {
const r = await fetch(url);
if (!r.ok) return [];
const d = await r.json();
return d.dictionary_terms?.compound ?? [];
} catch { return []; }
}

const searchInput = document.getElementById('searchInput');
const suggestionsEl = document.getElementById('suggestions');
let activeSugIdx = -1;
let currentSuggestions = [];

searchInput.addEventListener('input', () => {
clearTimeout(suggestTimeout);
const val = searchInput.value.trim();
if (val.length < 2) { hideSuggestions(); return; }
suggestTimeout = setTimeout(() => loadSuggestions(val), 200);
});

searchInput.addEventListener('keydown', e => {
if (e.key === 'ArrowDown') {
activeSugIdx = Math.min(activeSugIdx + 1, currentSuggestions.length - 1);
highlightSuggestion();
e.preventDefault();
} else if (e.key === 'ArrowUp') {
activeSugIdx = Math.max(activeSugIdx - 1, -1);
highlightSuggestion();
e.preventDefault();
} else if (e.key === 'Enter') {
if (activeSugIdx >= 0 && currentSuggestions[activeSugIdx]) {
selectSuggestion(currentSuggestions[activeSugIdx]);
} else {
doSearch(searchInput.value.trim());
}
hideSuggestions();
} else if (e.key === 'Escape') {
hideSuggestions();
}
});

document.addEventListener('click', e => {
if (!e.target.closest('.search-wrap')) hideSuggestions();
});

async function loadSuggestions(query) {
const terms = await fetchSuggestions(query);
currentSuggestions = terms;
activeSugIdx = -1;

if (!terms.length) { hideSuggestions(); return; }

suggestionsEl.innerHTML = '';
terms.forEach((term, i) => {
const div = document.createElement('div');
div.className = 'suggestion-item';
div.innerHTML = `<span class="sug-name">${term}</span>`;
div.addEventListener('mousedown', e => {
e.preventDefault();
selectSuggestion(term);
});
suggestionsEl.appendChild(div);
});

suggestionsEl.classList.add('visible');
}

function highlightSuggestion() {
const items = suggestionsEl.querySelectorAll('.suggestion-item');
items.forEach((el, i) => {
el.style.background = i === activeSugIdx ? 'var(--line)' : '';
});
if (activeSugIdx >= 0 && currentSuggestions[activeSugIdx]) {
searchInput.value = currentSuggestions[activeSugIdx];
}
}

function selectSuggestion(term) {
searchInput.value = term;
hideSuggestions();
doSearch(term);
}

function hideSuggestions() {
suggestionsEl.classList.remove('visible');
}

// ────────────────────────────────────────────────────
// QUICK SEARCH (example pills)
// ────────────────────────────────────────────────────
function quickSearch(query, displayName) {
searchInput.value = displayName || query;
doSearch(query, displayName);
}

// ────────────────────────────────────────────────────
// MAIN SEARCH
// ────────────────────────────────────────────────────
async function doSearch(query, forceDisplayName) {
if (!query) return;
hideSuggestions();
showLoader(true);
hideCard();
hideError();
hideEmpty();

let cid = null;
let props = null;
let physData = {};
let synonyms = [];

try {
// Résolution du nom — si c'est du texte (pas une formule brute),
// on tente l'autocomplete pour obtenir le nom anglais canonique.
// Ex : "caféine" → "caffeine", "benzène" → "benzene"
let searchQuery = query;
if (!/^[A-Z][a-z]?\d/.test(query) && !/^\[/.test(query)) {
// Semble être un nom, pas une formule ni un SMILES
try {
const suggestions = await fetchSuggestions(query);
if (suggestions.length > 0) searchQuery = suggestions[0];
} catch {}
}

cid = await searchCID(searchQuery);
// Fallback : essayer aussi le terme original si l'autocomplete n'a pas aidé
if (!cid && searchQuery !== query) cid = await searchCID(query);
if (!cid) throw new Error('not found');

currentCID = cid;

} catch(err) {
showLoader(false);
showError();
return;
}

// À partir d'ici, la molécule est trouvée — les erreurs suivantes
// ne doivent PAS déclencher "Molécule introuvable"
try {
[props, physData, synonyms] = await Promise.all([
fetchProperties(cid),
fetchPhysicalData(cid),
fetchSynonyms(cid)
]);
} catch {}

showLoader(false);

if (!props) {
showError();
return;
}

// forceDisplayName (nom FR) a priorité sur les synonymes PubChem
const displayName = forceDisplayName
|| synonyms.find(s => s.length < 30 && !/^\d/.test(s))
|| synonyms[0]
|| query;

renderMolecule(cid, displayName, props, physData || {}, synonyms);
}

// ────────────────────────────────────────────────────
// RENDER
// ────────────────────────────────────────────────────
function renderMolecule(cid, displayName, props, physData, synonyms) {
const card = document.getElementById('molCard');
const nameEl = document.getElementById('molName');
const formulaEl = document.getElementById('molFormula');
const iupacEl = document.getElementById('molIupac');
const propsGrid = document.getElementById('propsGrid');
const smilesText = document.getElementById('smilesText');
const pubchemLink = document.getElementById('pubchemLink');
const canvasWrap = document.getElementById('canvasWrap');

// Name: prefer shorter common name
const bestName = synonyms.find(s =>
s.length < 24 &&
!/^\d/.test(s) &&
!/^[A-Z]{2,}-/.test(s)
) || displayName;

nameEl.textContent = bestName;
formulaEl.textContent = props.MolecularFormula ?? '—';
iupacEl.textContent = props.IUPACName ? `IUPAC: ${props.IUPACName}` : '';

// SMILES
const smiles = props.IsomericSMILES || props.CanonicalSMILES;
smilesText.textContent = smiles ?? '';

// PubChem link
pubchemLink.href = `https://pubchem.ncbi.nlm.nih.gov/compound/${cid}`;

// Properties grid
const propItems = buildPropItems(props, physData);
propsGrid.innerHTML = '';
propItems.forEach(item => {
const cell = document.createElement('div');
cell.className = 'prop-cell';
cell.innerHTML = `
<div class="prop-label">${item.label}</div>
<div class="prop-value${item.accent ? ' accent' : ''}">${item.value}<span class="prop-unit">${item.unit ? ' ' + item.unit : ''}</span></div>
`;
propsGrid.appendChild(cell);
});

// Show card
card.style.display = 'block';
document.getElementById('searchSection').classList.add('has-result');

// Draw structure — image PNG PubChem
drawStructure(smiles, cid);

// Scroll to card smoothly
setTimeout(() => {
card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}, 100);
}

function buildPropItems(props, physData) {
const items = [];

if (props.MolecularWeight)
items.push({ label: 'Masse molaire', value: parseFloat(props.MolecularWeight).toFixed(3), unit: 'g/mol', accent: true });

if (props.ExactMass)
items.push({ label: 'Masse exacte', value: parseFloat(props.ExactMass).toFixed(4), unit: 'Da' });

if (physData.meltingPoint)
items.push({ label: 'Température de fusion', value: truncate(physData.meltingPoint, 22), unit: '' });

if (physData.boilingPoint)
items.push({ label: 'Température d\'ébullition', value: truncate(physData.boilingPoint, 22), unit: '' });

if (physData.flashPoint)
items.push({ label: 'Point d\'éclair', value: truncate(physData.flashPoint, 22), unit: '' });

if (physData.density)
items.push({ label: 'Densité', value: truncate(physData.density, 22), unit: '' });

if (props.XLogP != null)
items.push({ label: 'LogP (lipophilicité)', value: props.XLogP, unit: '' });

if (props.TPSA != null)
items.push({ label: 'Surface polaire', value: props.TPSA, unit: 'Å²' });

if (props.HBondDonorCount != null)
items.push({ label: 'Donneurs H', value: props.HBondDonorCount,
